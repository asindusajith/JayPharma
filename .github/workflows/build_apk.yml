name: Build & Release JayPharma APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "JayPharma Latest APK Release"
          body: |
            ### JayPharma Mobile Application - Latest Release
            - Automated cloud build generated from commit `${{ github.sha }}`
            - Includes:
              - Day-End Freeze & Day-Start with Management OTP & Liquid Glass UI
              - Dynamic Receipt Number Prefix (User ID / Code)
              - Collector-scoped invoices & Day-End summaries
              - Realtime SQL Server Sync
            
            **Direct Download Link**:
            [Download app-release.apk](https://github.com/${{ github.repository }}/releases/download/latest/app-release.apk)
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
