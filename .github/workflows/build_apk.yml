name: Build & Release JayPharma APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/JayPharma-v1.0.5-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/JayPharma-v1.0.5-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "JayPharma v1.0.5 (Build 6) - Direct Thermal POS Auto-Connect & Dropdown Fix"
          body: |
            ### JayPharma Mobile Application - v1.0.5 (Build 6)
            - Direct RFCOMM Channel 1 Bluetooth thermal printer connection engine
            - Auto-detects bonded printer and keeps it permanently in the dropdown & settings
            - Seamless auto-connect on app startup and automatic re-connect on print
            - Completely bypasses external printer apps and Android print dialogs on POS
            - Support for Copy Tabs: All (2 Copies), Customer Copy Only, Accounts Copy Only
            - Automatic runtime Bluetooth permissions request on Android 12+
            - Automated cloud build generated from commit `${{ github.sha }}`
            
            **Direct Download Links**:
            - [Download JayPharma-v1.0.5-release.apk](https://github.com/${{ github.repository }}/releases/download/latest/JayPharma-v1.0.5-release.apk)
            - [Download app-release.apk](https://github.com/${{ github.repository }}/releases/download/latest/app-release.apk)
          files: |
            build/app/outputs/flutter-apk/JayPharma-v1.0.5-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
